<!DOCTYPE html>
<html>
<head>...</head>
<body>
  <div id="paypal-button"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const amount = params.get('amount');
    const currency = params.get('currency') || 'USD';
    const orderFormId = params.get('orderFormId');
    const createOrderUrl = params.get('createOrderUrl'); // e.g. https://your-bff/checkout/createPayPalOrder

    const script = document.createElement('script');
    script.src = `https://www.paypal.com/sdk/js?client-id=YOUR_CLIENT_ID&currency=${currency}&intent=capture&components=buttons`;

    script.onload = () => {
      paypal.Buttons({
        createOrder: async (data, actions) => {
          // Prefer server-created order
          if (createOrderUrl && orderFormId) {
            try {
              const resp = await fetch(createOrderUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderFormId }),
              });
              const json = await resp.json();
              // backend should return { orderId: 'PAYPAL_ORDER_ID' }
              if (json?.orderId) return json.orderId;
            } catch (e) {
              console.error('createOrder backend failed', e);
              // fallback to client-side creation below
            }
          }
          // fallback: client-side order create
          return actions.order.create({
            purchase_units: [{ amount: { value: amount } }],
          });
        },

        onApprove: (data, actions) => {
          return actions.order.capture().then(details => {
            window.ReactNativeWebView?.postMessage(JSON.stringify({ success: true, details }));
          });
        },

        onCancel: () => {
          window.ReactNativeWebView?.postMessage(JSON.stringify({ success: false, error: 'Payment cancelled' }));
        },

        onError: (err) => {
          window.ReactNativeWebView?.postMessage(JSON.stringify({ success: false, error: err?.toString() || 'PayPal error' }));
        }

      }).render('#paypal-button');
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
