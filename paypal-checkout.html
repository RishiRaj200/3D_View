<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
    }
    #paypal-button {
      min-height: 300px;
    }
  </style>
</head>
<body>

  <div id="paypal-button"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId'); // ✅ VTEX PayPal orderId
    const currency = params.get('currency') || 'USD';

    if (!orderId) {
      window.ReactNativeWebView?.postMessage(JSON.stringify({
        success: false,
        error: 'Missing PayPal orderId'
      }));
    }

    const script = document.createElement('script');
    script.src =
      `https://www.paypal.com/sdk/js` +
      `?client-id=Ac4ydelneywT8ovo-N5TcNSiKvMCNthZtvojsP9J7WTravF2YSHaW8mZPCrHvGcbozHEBY-A_AWsuJ-b` +
      `&currency=${currency}` +
      `&intent=capture` +
      `&components=buttons`;

    script.onload = () => {
      if (!window.paypal) {
        window.ReactNativeWebView?.postMessage(JSON.stringify({
          success: false,
          error: 'PayPal SDK failed to load'
        }));
        return;
      }

      paypal.Buttons({

        // ✅ ALWAYS use backend-created VTEX order
        createOrder: () => {
          return orderId;
        },

        // ✅ Approval ONLY (NO CAPTURE)
        onApprove: (data) => {
          window.ReactNativeWebView?.postMessage(JSON.stringify({
            success: true,
            details: {
              id: data.orderID   // 🔵 PayPal SDK orderId
            }
          }));
        },


        onCancel: () => {
          window.ReactNativeWebView?.postMessage(JSON.stringify({
            success: false,
            error: 'Payment cancelled by user'
          }));
        },

        onError: (err) => {
          window.ReactNativeWebView?.postMessage(JSON.stringify({
            success: false,
            error: err?.toString() || 'PayPal error'
          }));
        }

      }).render('#paypal-button');
    };

    document.body.appendChild(script);
  </script>

</body>
</html>
